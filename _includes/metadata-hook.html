<!-- Pretendard 웹폰트 (한글 본문 글꼴). 쓰는 글자만 나눠 받는 dynamic subset 버전이다. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!-- Gaegu: 사이드바 블로그 이름에 쓰는 손글씨체 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap">
<!-- 네이버 서치어드바이저 사이트 소유 확인 -->
{% if site.webmaster_verifications.naver %}
<meta name="naver-site-verification" content="{{ site.webmaster_verifications.naver }}">
{% endif %}
